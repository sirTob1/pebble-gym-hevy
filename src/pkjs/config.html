<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PebbleGym Einstellungen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0b0f;
      --card-bg: #14141c;
      --card-border: #232330;
      --card-border-hover: #3b2c5c;
      --text-color: #f0f0f5;
      --text-muted: #8e8e9f;
      --accent: #8a2be2;
      --accent-hover: #7b1fa2;
      --accent-glow: rgba(138, 43, 226, 0.4);
      --success: #00e676;
      --error: #ff1744;
      --warning: #ffb300;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      margin-top: 10px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #00f0ff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 5px 0 0 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      border-color: var(--card-border-hover);
      box-shadow: 0 8px 24px rgba(138, 43, 226, 0.1);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 15px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-color);
    }

    input[type="text"], select, textarea {
      width: 100%;
      background-color: #08080c;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .btn {
      display: inline-block;
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #232330;
      color: var(--text-color);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background-color: #2d2d3d;
      box-shadow: none;
    }

    .btn-danger {
      background-color: rgba(255, 23, 68, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 23, 68, 0.3);
    }

    .btn-danger:hover {
      background-color: var(--error);
      color: white;
    }

    .status-msg {
      font-size: 13px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: 500;
    }

    .status-msg.success {
      background-color: rgba(0, 230, 118, 0.12);
      color: #55efc4;
      border: 1px solid rgba(0, 230, 118, 0.25);
      display: block;
    }

    .status-msg.error {
      background-color: rgba(255, 23, 68, 0.12);
      color: #ff7675;
      border: 1px solid rgba(255, 23, 68, 0.25);
      display: block;
    }

    .status-msg.warning {
      background-color: rgba(255, 179, 0, 0.12);
      color: #ffe082;
      border: 1px solid rgba(255, 179, 0, 0.25);
      display: block;
    }

    /* List styling for Routines & History */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: #0e0e15;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }

    .list-item:hover {
      border-color: #33334d;
    }

    .list-item-info {
      flex-grow: 1;
      margin-right: 15px;
    }

    .list-item-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .list-item-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
    }

    .list-btn {
      background-color: #1a1a24;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .list-btn:hover {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .list-btn.danger:hover {
      background-color: var(--error);
      border-color: var(--error);
    }

    .list-btn.active {
      background-color: var(--success);
      color: #0b0b0f;
      border-color: var(--success);
      font-weight: 600;
    }

    .preview-box {
      margin-top: 15px;
      background-color: #08080c;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      display: none;
    }

    .preview-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
      font-size: 13px;
    }

    .preview-exercise {
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1c1c28;
    }

    .preview-exercise:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .tab-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      transition: color 0.2s, background-color 0.2s;
    }

    .tab-btn.active {
      color: var(--text-color);
      background-color: #1a1a24;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Fixed bottom bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #0b0b0f;
      border-top: 1px solid var(--card-border);
      padding: 12px 15px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .bottom-bar .container {
      width: 100%;
      max-width: 480px;
      padding-bottom: 0;
      margin: 0;
    }

    /* Editor Styles */
    .editor-container {
      background-color: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .editor-exercise {
      background-color: #0e0e15;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .editor-exercise-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    .editor-exercise-title input[type="text"] {
      padding: 6px;
      font-size: 13px;
    }
    .editor-set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      background-color: #08080c;
      padding: 8px;
      border-radius: 8px;
    }
    .editor-set-row label {
      font-size: 12px;
      margin-bottom: 0;
      color: var(--text-muted);
      display: inline;
    }
    .editor-set-row input[type="number"] {
      background-color: #08080c;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 6px;
      border-radius: 6px;
      font-size: 13px;
      width: 55px;
      font-family: inherit;
    }
    .editor-set-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .editor-set-row .set-delete-btn {
      padding: 4px 8px;
      font-size: 11px;
    }
    .editor-set-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-grow: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>PebbleGym</h1>
    <p id="brand-subtitle">Hevy Workout Companion & History</p>
  </header>

  <!-- Section 1: Routine Import -->
  <div class="card">
    <div class="card-title" id="title-import">Routine importieren</div>
    
    <div class="tab-container">
      <button class="tab-btn active" id="tab-url-btn" onclick="switchImportTab('tab-url')">Hevy Link</button>
      <button class="tab-btn" id="tab-raw-btn" onclick="switchImportTab('tab-raw')">Raw Text / JSON</button>
    </div>

    <!-- Tab A: URL Input -->
    <div id="tab-url" class="tab-content active">
      <div class="form-group">
        <label for="hevy-url" id="label-hevy-url">Hevy Routine URL</label>
        <input type="text" id="hevy-url" placeholder="https://hevy.com/routine/..." oninput="clearImportMessage()">
      </div>
      <button class="btn" id="btn-load-hevy" style="margin-top: 10px;" onclick="loadHevyUrl()">Laden & Speichern</button>
    </div>

    <!-- Tab B: Raw Input -->
    <div id="tab-raw" class="tab-content">
      <div class="form-group">
        <label for="raw-data" id="label-raw-data">HTML oder JSON Inhalt einfügen</label>
        <textarea id="raw-data" rows="5" placeholder="Füge den XML/HTML Quelltext der Hevy Seite oder den exportierten JSON-Inhalt hier ein..." oninput="previewRawData()"></textarea>
      </div>
      <button class="btn" id="btn-import-raw" style="margin-top: 10px;" onclick="importRawData()">Importieren</button>
    </div>

    <div id="import-status" class="status-msg"></div>

    <div id="preview-box" class="preview-box">
      <div class="preview-title" id="preview-title-text">Vorschau</div>
      <div id="preview-content"></div>
    </div>
  </div>

  <!-- Section 2: Saved Routines -->
  <div class="card">
    <div class="card-title" id="title-my-routines">Meine Routinen</div>
    <div id="routines-list"></div>
    <div id="no-routines-text" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 10px 0;">Keine Routinen geladen. Bitte importiere eine Routine oben.</div>
  </div>

  <!-- Section 2B: Routine Editor (Hidden by default) -->
  <div id="routine-editor" class="editor-container" style="display: none;">
    <div class="card-title">
      <span id="editor-title-text">Routine bearbeiten</span>
      <button class="list-btn danger" style="padding: 4px 8px; font-weight: bold;" onclick="closeRoutineEditor()">X</button>
    </div>
    
    <div class="form-group">
      <label for="edit-routine-title" id="label-edit-routine-title">Routine Name</label>
      <input type="text" id="edit-routine-title" placeholder="Routine Name">
    </div>
    
    <div id="editor-exercises-container">
      <!-- Dynamic list of exercises & sets will be rendered here -->
    </div>
    
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button class="btn" id="btn-editor-save" onclick="saveRoutineEdits()">Speichern</button>
      <button class="btn btn-secondary" id="btn-editor-cancel" onclick="closeRoutineEditor()">Abbrechen</button>
    </div>
  </div>

  <!-- Section 3: History -->
  <div class="card">
    <div class="card-title">
      <span id="title-history">Trainingsverlauf</span>
      <button class="list-btn" id="btn-export-csv" style="font-size: 11px; padding: 4px 8px;" onclick="exportHistoryCSV()">CSV Export</button>
    </div>
    <div id="history-list"></div>
    <div id="no-history-text" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 10px 0;">Noch keine aufgezeichneten Workouts vorhanden.</div>
    <button class="btn btn-secondary btn-danger" id="btn-clear-history" style="margin-top: 15px; padding: 8px; font-size: 13px;" onclick="clearAllHistory()">Verlauf leeren</button>
  </div>

  <!-- Section 4: Settings -->
  <div class="card">
    <div class="card-title" id="title-settings">Einstellungen</div>
    <div class="form-group">
      <label for="language-select" id="label-language-select">Sprache / Language</label>
      <select id="language-select" onchange="changeLanguage()">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="form-group">
      <label for="weight-unit" id="label-weight-unit">Gewichtseinheit</label>
      <select id="weight-unit">
        <option value="kg" id="weight-unit-kg" selected>Kilogramm (kg)</option>
        <option value="lbs" id="weight-unit-lbs">Pfund (lbs)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="rest-time" id="label-rest-time">Standard Pausenzeit</label>
      <select id="rest-time">
        <option value="60" id="rest-60">60 Sekunden</option>
        <option value="90" id="rest-90" selected>90 Sekunden</option>
        <option value="120" id="rest-120">120 Sekunden</option>
        <option value="180" id="rest-180">180 Sekunden</option>
      </select>
    </div>
    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px;">
      <label for="auto-reload" id="label-auto-reload" style="margin-bottom: 0; cursor: pointer; flex-grow: 1;">Pläne vor dem Start über Hevy Link aktualisieren</label>
      <input type="checkbox" id="auto-reload" style="width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent);">
    </div>
    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px;">
      <label for="show-hints" id="label-show-hints" style="margin-bottom: 0; cursor: pointer; flex-grow: 1;">Tastenhilfe auf der Uhr anzeigen</label>
      <input type="checkbox" id="show-hints" style="width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent);">
    </div>
  </div>
</div>

<div class="bottom-bar">
  <div class="container" style="padding: 0; margin: 0;">
    <button id="save-btn" class="btn" onclick="saveAndClose()">Speichern & Schließen</button>
  </div>
</div>

    if (replacements) {
      for (var repKey in replacements) {
        text = text.replace("{" + repKey + "}", replacements[repKey]);
      }
    }
    return text;
  }

  // Parse Query Parameters or Hash Parameters
  function getQueryOrHashParam(name) {
    var query = window.location.hash.substring(1);
    if (!query) {
      query = window.location.search.substring(1);
    }
    var vars = query.split("&");
    for (var i = 0; i < vars.length; i++) {
      var pair = vars[i].split("=");
      if (decodeURIComponent(pair[0]) === name) {
        return decodeURIComponent(pair[1]);
      }
    }
    return "";
  }

  // Initialize Data
  function init() {
    var routinesStr = getQueryOrHashParam("routines");
    var historyStr = getQueryOrHashParam("history");
    var activeIdStr = getQueryOrHashParam("active_id");
    
    if (routinesStr) {
      try {
        savedRoutines = JSON.parse(routinesStr);
      } catch(e) {
        console.log("Error parsing routines query parameter: " + e);
        savedRoutines = [];
      }
    }
    if (historyStr) {
      try {
        workoutHistory = JSON.parse(historyStr);
      } catch(e) {
        console.log("Error parsing history query parameter: " + e);
        workoutHistory = [];
      }
    }
    if (activeIdStr) {
      activeRoutineId = activeIdStr;
    }
    
    // Load local options from localStorage or query if sent
    var storedLanguage = localStorage.getItem("pebble_gym_language");
    if (storedLanguage) {
      language = storedLanguage;
    } else {
      var navLang = navigator.language || navigator.userLanguage;
      if (navLang && navLang.substring(0, 2) === "en") {
        language = "en";
      } else {
        language = "de";
      }
    }
    document.getElementById("language-select").value = language;
    
    var storedUnit = localStorage.getItem("pebble_gym_unit");
    if (storedUnit) weightUnit = storedUnit;
    document.getElementById("weight-unit").value = weightUnit;
    
    var storedRest = localStorage.getItem("pebble_gym_rest");
    if (storedRest) restTime = storedRest;
    document.getElementById("rest-time").value = restTime;
    
    var autoReload = localStorage.getItem("pebble_gym_auto_reload") === "true";
    document.getElementById("auto-reload").checked = autoReload;
    
    var showHints = localStorage.getItem("pebble_gym_show_hints") !== "false";
    document.getElementById("show-hints").checked = showHints;
    
    updatePageLanguage();
  }

  // Switch between tabs
  function switchImportTab(tabId) {
    var tabs = document.getElementsByClassName("tab-content");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.remove("active");
    }
    document.getElementById(tabId).classList.add("active");

    var buttons = document.getElementsByClassName("tab-btn");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove("active");
    }
    event.currentTarget.classList.add("active");
    clearImportMessage();
  }

  // Scraper parser logic (runs in configuration page as fallback)
  function parseHevyRoutineData(htmlOrJson) {
    var routineData = null;
    
    try {
      var parsed = JSON.parse(htmlOrJson);
      if (parsed.routine) {
        routineData = parsed.routine;
      } else if (parsed.title && parsed.exercises) {
        routineData = parsed;
      }
    } catch (e) {
      var match = htmlOrJson.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);
      if (match) {
        try {
          var data = JSON.parse(match[1]);
          if (data.props && data.props.pageProps && data.props.pageProps.routine) {
            routineData = data.props.pageProps.routine;
          } else if (data.props && data.props.pageProps && data.props.pageProps.initialState && data.props.pageProps.initialState.routine) {
            routineData = data.props.pageProps.initialState.routine;
          }
        } catch (err) {
          console.log("Error parsing Next JSON: " + err);
        }
      }
    }
    
    if (!routineData) return null;
    
    var routine = {
      id: routineData.id ? routineData.id.toString() : "r_" + Date.now(),
      title: routineData.title || "Routine",
      exercises: []
    };
    
    var exercises = routineData.exercises || [];
    for (var i = 0; i < exercises.length; i++) {
      var ex = exercises[i];
      var exTitle = ex.title || (ex.exercise_template && ex.exercise_template.name) || "Exercise " + (i + 1);
      var sets = ex.sets || [];
      var cleanSets = [];
      
      for (var j = 0; j < sets.length; j++) {
        var s = sets[j];
        var weight = s.weight_kg !== null && s.weight_kg !== undefined ? Math.round(s.weight_kg * 100) : 0;
        var isTimed = s.duration_seconds !== null && s.duration_seconds !== undefined && s.duration_seconds > 0;
        cleanSets.push({
          index: j,
          reps: s.reps !== null && s.reps !== undefined ? s.reps : 0,
          weight: weight,
          is_timed: isTimed || !!s.is_timed,
          target_duration: isTimed ? s.duration_seconds : (s.target_duration || 0)
        });
      }
      
      routine.exercises.push({
        index: i,
        name: exTitle,
        sets: cleanSets
      });
    }
    
    return routine;
  }

  // Import raw JSON/HTML data pasted
  function importRawData() {
    var rawText = document.getElementById("raw-data").value.trim();
    if (!rawText) {
      showImportMessage(t("status-paste-first"), "error");
      return;
    }
    
    var parsed = parseHevyRoutineData(rawText);
    if (parsed) {
      // Add to saved list
      var existingIdx = -1;
      for (var i = 0; i < savedRoutines.length; i++) {
        if (savedRoutines[i].id === parsed.id) {
          existingIdx = i;
          break;
        }
      }
      
      if (existingIdx !== -1) {
        savedRoutines[existingIdx] = parsed;
        showImportMessage(t("status-update-success", {title: parsed.title}), "success");
      } else {
        savedRoutines.push(parsed);
        activeRoutineId = parsed.id; // Auto select
        showImportMessage(t("status-import-success", {title: parsed.title}), "success");
      }
      
      document.getElementById("raw-data").value = "";
      document.getElementById("preview-box").style.display = "none";
      renderRoutines();
    } else {
      showImportMessage(t("status-parse-error"), "error");
    }
  }

  // Preview raw data
  function previewRawData() {
    var rawText = document.getElementById("raw-data").value.trim();
    var previewBox = document.getElementById("preview-box");
    var previewContent = document.getElementById("preview-content");
    
    if (!rawText) {
      previewBox.style.display = "none";
      return;
    }
    
    var parsed = parseHevyRoutineData(rawText);
    if (parsed) {
      previewBox.style.display = "block";
      document.getElementById("preview-title-text").innerText = t("preview-title-prefix") + parsed.title;
      
      var html = "";
      parsed.exercises.forEach(function(ex) {
        html += "<div class='preview-exercise'>";
        html += "<strong>" + ex.name + "</strong> (" + ex.sets.length + " " + t("history-meta-sets") + ")<br>";
        var setStrings = ex.sets.map(function(s) {
          if (s.is_timed) {
            return (s.target_duration || 0) + " s";
          }
          return s.reps + "x " + (s.weight / 100) + " kg";
        });
        html += "<span style='color: var(--text-muted);'>" + setStrings.join(" | ") + "</span>";
        html += "</div>";
      });
      previewContent.innerHTML = html;
    } else {
      previewBox.style.display = "none";
    }
  }

  // Trigger loading via Hevy URL
  function loadHevyUrl() {
    var url = document.getElementById("hevy-url").value.trim();
    if (!url) {
      showImportMessage(t("status-enter-url"), "error");
      return;
    }
    
    if (url.indexOf("hevy.com/routine/") === -1 && url.indexOf("link.hevy.com/routine/") === -1) {
      showImportMessage(t("status-invalid-url"), "error");
      return;
    }

    // Try a direct client-side fetch first. (This might fail due to CORS)
    showImportMessage(t("status-direct-fetch"), "warning");
    
    var shortId = null;
    var match = url.match(/\/routine\/([a-zA-Z0-9]+)/);
    if (match) {
      shortId = match[1];
    } else {
      var trimmed = url.trim();
      if (trimmed.length === 11 && /^[a-zA-Z0-9]+$/.test(trimmed)) {
        shortId = trimmed;
      }
    }

    if (!shortId) {
      showImportMessage(t("status-id-error"), "error");
      return;
    }

    var apiUrl = "https://api.hevyapp.com/routine_with_short_id/" + shortId;
    
    var xhr = new XMLHttpRequest();
    xhr.open("GET", apiUrl, true);
    xhr.setRequestHeader("x-api-key", "shelobs_hevy_web");
    xhr.setRequestHeader("Hevy-Platform", "web");
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
      if (xhr.status === 200) {
        var parsed = parseHevyRoutineData(xhr.responseText);
        if (parsed) {
          parsed.hevy_link = url; // Save the link for auto-updates
          var existingIdx = -1;
          for (var i = 0; i < savedRoutines.length; i++) {
            if (savedRoutines[i].id === parsed.id) {
              existingIdx = i;
              break;
            }
          }
          if (existingIdx !== -1) {
            savedRoutines[existingIdx] = parsed;
          } else {
            savedRoutines.push(parsed);
            activeRoutineId = parsed.id;
          }
          showImportMessage(t("status-load-success", {title: parsed.title}), "success");
          document.getElementById("hevy-url").value = "";
          renderRoutines();
        } else {
          fallbackToJSSync(url);
        }
      } else {
        fallbackToJSSync(url);
      }
    };
    xhr.onerror = function() {
      fallbackToJSSync(url);
    };
    xhr.send();
  }

  function fallbackToJSSync(url) {
    showImportMessage(t("status-fetch-failed"), "warning");
    // Save URL to query later
    document.getElementById("hevy-url").dataset.pendingUrl = url;
  }

  function showImportMessage(msg, type) {
    var el = document.getElementById("import-status");
    el.innerText = msg;
    el.className = "status-msg " + type;
  }

  function clearImportMessage() {
    var el = document.getElementById("import-status");
    el.className = "status-msg";
    el.innerText = "";
  }

  // Render Saved Routines
  function renderRoutines() {
    var list = document.getElementById("routines-list");
    var noRoutinesText = document.getElementById("no-routines-text");
    list.innerHTML = "";
    
    if (savedRoutines.length === 0) {
      noRoutinesText.style.display = "block";
      return;
    }
    noRoutinesText.style.display = "none";
    
    savedRoutines.forEach(function(routine) {
      var item = document.createElement("div");
      item.className = "list-item";
      
      var info = document.createElement("div");
      info.className = "list-item-info";
      
      var title = document.createElement("div");
      title.className = "list-item-title";
      title.innerText = routine.title;
      
      var meta = document.createElement("div");
      meta.className = "list-item-meta";
      meta.innerText = t("meta-exercises", {count: routine.exercises.length});
      
      info.appendChild(title);
      info.appendChild(meta);
      
      var actions = document.createElement("div");
      actions.className = "list-item-actions";
      
      var isActive = (routine.id === activeRoutineId);
      var actBtn = document.createElement("button");
      actBtn.className = "list-btn" + (isActive ? " active" : "");
      actBtn.innerText = isActive ? t("active-btn-active") : t("active-btn-activate");
      actBtn.onclick = function() {
        activeRoutineId = routine.id;
        renderRoutines();
      };
      actions.appendChild(actBtn);

      var editBtn = document.createElement("button");
      editBtn.className = "list-btn";
      editBtn.innerText = t("edit-btn-edit");
      editBtn.onclick = function() {
        openRoutineEditor(routine.id);
      };
      actions.appendChild(editBtn);
      
      var delBtn = document.createElement("button");
      delBtn.className = "list-btn danger";
      delBtn.innerText = t("delete-btn-delete");
      delBtn.onclick = function() {
        if (confirm(t("confirm-delete-routine", {title: routine.title}))) {
          savedRoutines = savedRoutines.filter(function(r) { return r.id !== routine.id; });
          if (activeRoutineId === routine.id) {
            activeRoutineId = savedRoutines.length > 0 ? savedRoutines[0].id : "";
          }
          renderRoutines();
        }
      };
      actions.appendChild(delBtn);
      
      item.appendChild(info);
      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  var editingRoutine = null;

  function openRoutineEditor(routineId) {
    var routine = null;
    for (var i = 0; i < savedRoutines.length; i++) {
      if (savedRoutines[i].id === routineId) {
        routine = savedRoutines[i];
        break;
      }
    }
    if (!routine) return;
    
    // Deep clone the routine so changes can be canceled
    editingRoutine = JSON.parse(JSON.stringify(routine));
    
    document.getElementById("edit-routine-title").value = editingRoutine.title;
    renderEditorExercises();
    
    document.getElementById("routine-editor").style.display = "block";
    document.getElementById("routine-editor").scrollIntoView({ behavior: 'smooth' });
  }

  function closeRoutineEditor() {
    editingRoutine = null;
    document.getElementById("routine-editor").style.display = "none";
  }

  function renderEditorExercises() {
    var container = document.getElementById("editor-exercises-container");
    container.innerHTML = "";
    
    if (!editingRoutine || !editingRoutine.exercises) return;
    
    editingRoutine.exercises.forEach(function(ex, exIdx) {
      var exDiv = document.createElement("div");
      exDiv.className = "editor-exercise";
      
      var titleDiv = document.createElement("div");
      titleDiv.className = "editor-exercise-title";
      
      var exNameInput = document.createElement("input");
      exNameInput.type = "text";
      exNameInput.value = ex.name;
      exNameInput.style.flexGrow = "1";
      exNameInput.oninput = function() {
        ex.name = exNameInput.value;
      };
      titleDiv.appendChild(exNameInput);
      
      var addSetBtn = document.createElement("button");
      addSetBtn.className = "list-btn";
      addSetBtn.innerText = t("editor-btn-add-set");
      addSetBtn.onclick = function() {
        addSetToEditor(exIdx);
      };
      titleDiv.appendChild(addSetBtn);
      
      exDiv.appendChild(titleDiv);
      
      var setsContainer = document.createElement("div");
      
      ex.sets.forEach(function(set, setIdx) {
        var setRow = document.createElement("div");
        setRow.className = "editor-set-row";
        
        var setLabel = document.createElement("span");
        setLabel.innerText = (language === "de" ? "Satz " : "Set ") + (setIdx + 1) + ":";
        setLabel.style.fontSize = "12px";
        setLabel.style.fontWeight = "600";
        setRow.appendChild(setLabel);
        
        var inputsDiv = document.createElement("div");
        inputsDiv.className = "editor-set-inputs";
        
        // Timer Checkbox
        var timerLabel = document.createElement("label");
        var timerCheckbox = document.createElement("input");
        timerCheckbox.type = "checkbox";
        timerCheckbox.checked = !!set.is_timed;
        timerCheckbox.onchange = function() {
          set.is_timed = timerCheckbox.checked;
          renderEditorExercises();
        };
        timerLabel.appendChild(timerCheckbox);
        timerLabel.appendChild(document.createTextNode(" " + t("editor-label-timer")));
        inputsDiv.appendChild(timerLabel);
        
        if (set.is_timed) {
          // Duration input
          var durLabel = document.createElement("label");
          durLabel.innerText = t("editor-label-duration") + ":";
          inputsDiv.appendChild(durLabel);
          
          var durInput = document.createElement("input");
          durInput.type = "number";
          durInput.value = set.target_duration || 0;
          durInput.min = "0";
          durInput.oninput = function() {
            set.target_duration = parseInt(durInput.value, 10) || 0;
          };
          inputsDiv.appendChild(durInput);
        } else {
          // Reps input
          var repsLabel = document.createElement("label");
          repsLabel.innerText = t("editor-label-reps") + ":";
          inputsDiv.appendChild(repsLabel);
          
          var repsInput = document.createElement("input");
          repsInput.type = "number";
          repsInput.value = set.reps || 0;
          repsInput.min = "0";
          repsInput.oninput = function() {
            set.reps = parseInt(repsInput.value, 10) || 0;
          };
          inputsDiv.appendChild(repsInput);
          
          // Weight input
          var weightLabel = document.createElement("label");
          var displayUnit = weightUnit === "lbs" ? "lbs" : "kg";
          weightLabel.innerText = t("editor-label-weight") + " (" + displayUnit + "):";
          inputsDiv.appendChild(weightLabel);
          
          var weightInput = document.createElement("input");
          weightInput.type = "number";
          weightInput.step = "0.1";
          weightInput.value = (set.weight / 100) || 0;
          weightInput.min = "0";
          weightInput.oninput = function() {
            set.weight = Math.round(parseFloat(weightInput.value) * 100) || 0;
          };
          inputsDiv.appendChild(weightInput);
        }
        
        setRow.appendChild(inputsDiv);
        
        // Delete button
        var delBtn = document.createElement("button");
        delBtn.className = "list-btn danger set-delete-btn";
        delBtn.innerText = "X";
        delBtn.onclick = function() {
          deleteSetFromEditor(exIdx, setIdx);
        };
        setRow.appendChild(delBtn);
        
        setsContainer.appendChild(setRow);
      });
      
      exDiv.appendChild(setsContainer);
      container.appendChild(exDiv);
    });
  }

  function addSetToEditor(exIdx) {
    if (!editingRoutine || !editingRoutine.exercises[exIdx]) return;
    var ex = editingRoutine.exercises[exIdx];
    var lastSet = ex.sets[ex.sets.length - 1];
    
    var newSet = {
      index: ex.sets.length,
      reps: lastSet ? lastSet.reps : 10,
      weight: lastSet ? lastSet.weight : 0,
      is_timed: lastSet ? !!lastSet.is_timed : false,
      target_duration: lastSet ? (lastSet.target_duration || 0) : 60
    };
    
    ex.sets.push(newSet);
    renderEditorExercises();
  }

  function deleteSetFromEditor(exIdx, setIdx) {
    if (!editingRoutine || !editingRoutine.exercises[exIdx]) return;
    var ex = editingRoutine.exercises[exIdx];
    ex.sets.splice(setIdx, 1);
    
    // Re-index sets
    ex.sets.forEach(function(set, idx) {
      set.index = idx;
    });
    
    renderEditorExercises();
  }

  function saveRoutineEdits() {
    if (!editingRoutine) return;
    
    var title = document.getElementById("edit-routine-title").value.trim();
    if (!title) {
      alert(language === "de" ? "Bitte gib einen Routine-Namen ein." : "Please enter a routine name.");
      return;
    }
    
    editingRoutine.title = title;
    
    // Update in savedRoutines array
    var routineIdx = -1;
    for (var i = 0; i < savedRoutines.length; i++) {
      if (savedRoutines[i].id === editingRoutine.id) {
        routineIdx = i;
        break;
      }
    }
    if (routineIdx !== -1) {
      savedRoutines[routineIdx] = editingRoutine;
    }
    
    closeRoutineEditor();
    renderRoutines();
  }

  // Render History List
  function renderHistory() {
    var list = document.getElementById("history-list");
    var noHistoryText = document.getElementById("no-history-text");
    list.innerHTML = "";
    
    if (workoutHistory.length === 0) {
      noHistoryText.style.display = "block";
      return;
    }
    noHistoryText.style.display = "none";
    
    // Render in reverse chronological order
    for (var i = workoutHistory.length - 1; i >= 0; i--) {
      var w = workoutHistory[i];
      var item = document.createElement("div");
      item.className = "list-item";
      
      var info = document.createElement("div");
      info.className = "list-item-info";
      
      var title = document.createElement("div");
      title.className = "list-item-title";
      
      var date = new Date(w.timestamp);
      var dateStr = date.toLocaleDateString() + " " + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      title.innerText = w.routine_title + " (" + dateStr + ")";
      
      var meta = document.createElement("div");
      meta.className = "list-item-meta";
      
      var exerciseStrings = [];
      var exercises = w.exercises || [];
      exercises.forEach(function(ex) {
        var completedSets = 0;
        ex.sets.forEach(function(s) {
          if (s && s.status === 1) completedSets++;
        });
        exerciseStrings.push(ex.name + " (" + completedSets + " " + t("history-meta-sets") + ")");
      });
      meta.innerText = exerciseStrings.join(", ");
      
      info.appendChild(title);
      info.appendChild(meta);
      
      var actions = document.createElement("div");
      actions.className = "list-item-actions";
      
      var delBtn = document.createElement("button");
      delBtn.className = "list-btn danger";
      delBtn.innerText = t("remove-btn-remove");
      
      // IIFE to capture current loop index
      (function(idx) {
        delBtn.onclick = function() {
          if (confirm(t("confirm-delete-history-item"))) {
            workoutHistory.splice(idx, 1);
            renderHistory();
          }
        };
      })(i);
      
      actions.appendChild(delBtn);
      
      item.appendChild(info);
      item.appendChild(actions);
      list.appendChild(item);
    }
  }

  // Delete all history
  function clearAllHistory() {
    if (confirm(t("confirm-clear-history"))) {
      workoutHistory = [];
      renderHistory();
    }
  }

  // Export History to CSV
  function exportHistoryCSV() {
    if (workoutHistory.length === 0) {
      alert(t("alert-no-history"));
      return;
    }
    
    var csvContent = "data:text/csv;charset=utf-8,";
    csvContent += t("routine-header-csv");
    
    workoutHistory.forEach(function(w) {
      var dateStr = new Date(w.timestamp).toISOString();
      var exercises = w.exercises || [];
      exercises.forEach(function(ex) {
        var sets = ex.sets || [];
        sets.forEach(function(s, sIdx) {
          if (s && s.status === 1) {
            var row = [
              dateStr,
              '"' + w.routine_title.replace(/"/g, '""') + '"',
              '"' + ex.name.replace(/"/g, '""') + '"',
              sIdx + 1,
              s.reps,
              s.weight / 100
            ];
            csvContent += row.join(",") + "\n";
          }
        });
      });
    });
    
    var encodedUri = encodeURI(csvContent);
    var link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "pebble_gym_history_" + Date.now() + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // Save Settings and Close WebView
  function saveAndClose() {
    weightUnit = document.getElementById("weight-unit").value;
    restTime = document.getElementById("rest-time").value;
    language = document.getElementById("language-select").value;
    var autoReload = document.getElementById("auto-reload").checked;
    var showHints = document.getElementById("show-hints").checked;
    
    localStorage.setItem("pebble_gym_unit", weightUnit);
    localStorage.setItem("pebble_gym_rest", restTime);
    localStorage.setItem("pebble_gym_language", language);
    localStorage.setItem("pebble_gym_auto_reload", autoReload ? "true" : "false");
    localStorage.setItem("pebble_gym_show_hints", showHints ? "true" : "false");
    
    var pendingUrl = document.getElementById("hevy-url").dataset.pendingUrl || "";
    
    var response = {
      saved_routines: savedRoutines,
      active_routine_id: activeRoutineId,
      workout_history: workoutHistory,
      hevy_link: pendingUrl,
      language: language,
      weight_unit: weightUnit,
      rest_time: restTime,
      auto_reload: autoReload ? "true" : "false",
      show_button_hints: showHints ? "true" : "false"
    };
    
    var responseStr = encodeURIComponent(JSON.stringify(response));
    console.log("PebbleGym Config: Sending response to watch: " + responseStr.substring(0, 150));
    window.location.href = "pebblejs://close#" + responseStr;
  }

  // Initialize page
  window.onload = init;
</script>
</body>
</html>
